name: Refresh verified preview release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-verified-preview-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Refresh verified release fallback
        id: release
        run: |
          set -euo pipefail
          node scripts/refresh-release-fallback.mjs
          if git diff --quiet -- src/data/verified-release.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Checked-in verified release metadata is current."
            exit 0
          fi
          tag="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("src/data/verified-release.json", "utf8")).tag)')"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
            echo "::error::Unexpected verified preview release tag: $tag"
            exit 1
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=automation/verified-release-${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare verified-release branch
        id: branch
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REPOSITORY_OWNER:$RELEASE_BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr update-branch "$pull_request" --repo "$GITHUB_REPOSITORY" --rebase
            git fetch origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            git switch --create "$RELEASE_BRANCH" --track "origin/$RELEASE_BRANCH"
          else
            if git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
              git push origin --delete "$RELEASE_BRANCH"
            fi
            git switch --create "$RELEASE_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/verified-release.json
            git commit -m "chore: refresh verified release to $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          branch_tag="$(git show HEAD:src/data/verified-release.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag"])')"
          [[ "$branch_tag" == "$RELEASE_TAG" ]] || {
            echo "::error::Prepared branch contains $branch_tag, expected $RELEASE_TAG."
            exit 1
          }
          echo "number=$pull_request" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or reuse verified-release pull request
        id: pull-request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          EXISTING_PR: ${{ steps.branch.outputs.number }}
        run: |
          set -euo pipefail
          pull_request="$EXISTING_PR"
          if [[ -z "$pull_request" ]]; then
            cat > "$RUNNER_TEMP/verified-release-pr.md" <<EOF
          ## Summary

          Refresh the checked-in download fallback to the latest preview release whose GitHub asset digests, checksum file, and release manifest agree.

          ## Validation

          The workflow runs the complete website CI for the proposed release metadata and enables auto-merge only after all required checks pass.

          ## Scope

          Generated release metadata only; no application code, credentials, or benchmark results are changed.
          EOF
            pull_request_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$RELEASE_BRANCH" \
              --title "chore: refresh verified release to $RELEASE_TAG" \
              --body-file "$RUNNER_TEMP/verified-release-pr.md")"
            pull_request="${pull_request_url##*/}"
          fi
          echo "number=$pull_request" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata branch
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          previous_run_id="$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch "$RELEASE_BRANCH" --event workflow_dispatch \
              --limit 20 --json databaseId,headSha \
              | jq -r \
                --arg expected_sha "$BRANCH_HEAD_SHA" \
                '[.[] | select(.headSha == $expected_sha) | .databaseId] | max // 0'
          )"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
          run_id=""
          delay=15
          for _ in $(seq 1 12); do
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --branch "$RELEASE_BRANCH" --event workflow_dispatch \
                --limit 20 --json databaseId,event,headSha,createdAt \
                | jq -r \
                  --arg expected_sha "$BRANCH_HEAD_SHA" \
                  --argjson previous_run_id "$previous_run_id" \
                  '
                    [
                      .[] | select(
                        .event == "workflow_dispatch"
                        and .headSha == $expected_sha
                        and .databaseId > $previous_run_id
                      )
                    ][0].databaseId // empty
                  '
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep "$delay"
            if (( delay < 60 )); then
              delay=$((delay * 2 > 60 ? 60 : delay * 2))
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Website CI did not start for $BRANCH_HEAD_SHA."
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify deployment checks and merge release metadata
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --auto

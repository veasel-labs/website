name: Website issue
description: Report broken content, links, layout, or accessibility.
labels: [website]
body:
  - type: dropdown
    id: category
    attributes:
      label: What is affected?
      options: [Content, Link, Visual layout, Accessibility, Theme, Other]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and viewport
      placeholder: Firefox 140, 390 × 844
  - type: textarea
    id: details
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or reproduction steps
